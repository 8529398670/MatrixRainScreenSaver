name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxft-dev pkg-config
      - name: Engine tests (with sanitizers)
        run: make test SAN=1
      - run: make linux
      - run: sh scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/*.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: make test SAN=1
      - run: make macos-zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/MatrixRain.saver.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + engine tests (MSVC)
        shell: pwsh
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MatrixRain.scr

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
